<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0E10" />
    <meta
      name="description"
      content="NIOS Glass Cockpit - institutional financial terminal for the four-ring sovereign trading system. Flat matte surfaces, paper sandbox and live vault."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>NIOS Glass Cockpit - Institutional Financial Terminal</title>
    <!-- Critical inline paint: the canvas is already the terminal colour before any
         stylesheet or module resolves, so there is zero flash of unstyled content. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      html {
        color-scheme: dark;
      }
      body {
        background: #0d0e10;
        color: #f4f5f7;
        font-family: "Inter", "Geist", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        background: #0d0e10;
      }
    </style>
  </head>
  <body style="background: #0d0e10; color: #f4f5f7">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
